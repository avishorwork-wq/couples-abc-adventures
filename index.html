 {n:'Midnight Rose',g1:'#1a1030',g2:'#4a1c5e',light:false},

/* ====== API ====== */
function api(path,o){return fetch(APP.api+path,{method:'POST',body:JSON.stringify(o)}).then(r=>r.json().catch(()=>({err:'network'})))}
function sync(){
 if(!TOK||!started)return;
 if(syncing){again=1;return}
 syncing=1;
 const o={tok:TOK,S:S,M:live().map(m=>({id:m.id,l:m.l,t:m.t,ts:m.ts,mime:m.mime,size:m.size,n:m.n,thumb:m.thumb?1:0,del:0}))};
 if(cfgDirty&&C){o.C=C;o.cu=C.cu}
 api('/sync',o).then(r=>{

 }).catch(e=>{setSy('⚠️ offline – will retry');clearTimeout(syncT);syncT=setTimeout(sync,10000)}).then(()=>{syncing=0;if(again){again=0;clearTimeout(syncT);syncT=setTimeout(sync,300)}})
}

 const doneActs=ev.filter(e=>e.k=='done').map(e=>actName(e.l));

  const parts=[];if(doneActs.length)parts.push('✅ '+doneActs.join(', '));if(mediaTxt)parts.push(mediaTxt);

 const parts=doneActs.map(a=>'✅ Done: '+a);if(mediaTxt)parts.push(mediaTxt+' added!');

const CH=950000; // chars per chunk (~700KB raw)
function compress(file,maxDim,q){return new Promise((ok,no)=>{
 const img=new Image();img.onload=()=>{const sc=Math.min(1,maxDim/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  cv.toBlob(b=>b?ok(b):no('compress'),'image/jpeg',q)};img.onerror=()=>no('load');
 img.src=URL.createObjectURL(file)})}
function blobB64(b){return new Promise(ok=>{const f=new FileReader();f.onload=()=>ok(String(f.result).split(',')[1]);f.readAsDataURL(b)})}
async function uploadOne(file){
 const isV=file.type.indexOf('video')==0;
 const id='m'+uid();
 const m={id:id,l:cur>=0?D()[cur].l:'',t:isV?'v':'i',ts:Date.now(),mime:isV?file.type:'image/jpeg',_u:URL.createObjectURL(file)};
 M.push(m);refresh();snd('up');noteAct('added new memories to '+actName(m.l)+' 📸',m.l);
 try{
  if(isV){
   if(file.size>8*1024*1024){toast('Videos are capped at 8 MB for now');M.splice(M.indexOf(m),1);refresh();return}
   const b64=await blobB64(file);const chunks=Math.ceil(b64.length/CH);m.n=chunks;m.size=file.size;
   for(let i=0;i<chunks;i++){
    setSy('⏫ uploading '+Math.round(i/chunks*100)+'%');
    const r=await api('/up',{tok:TOK,id,part:String(i),data:b64.slice(i*CH,(i+1)*CH),size:file.size,final:i==chunks-1,l:m.l,t:'v',mime:m.mime,n:chunks});
    if(r.err)throw r.err}
  }else{
   const full=await compress(file,1600,.82),thumb=await compress(file,420,.7);
   m.size=full.size;m.n=1;m.thumb=1;
   const fb=await blobB64(full),tb=await blobB64(thumb);
   let r=await api('/up',{tok:TOK,id,part:'t',data:tb,size:full.size});
   if(r.err)throw r.err;
   // split full into chunks if needed
   const chunks=Math.ceil(fb.length/CH);m.n=chunks;
   for(let i=0;i<chunks;i++){
    setSy('⏫ uploading '+Math.round(i/chunks*100)+'%');
    r=await api('/up',{tok:TOK,id,part:String(i),data:fb.slice(i*CH,(i+1)*CH),size:full.size,final:i==chunks-1,l:m.l,t:'i',mime:'image/jpeg',n:chunks,thumb:1});
    if(r.err)throw r.err}
  }
  setSy('☁️ synced');sv();
 }catch(e){M.splice(M.indexOf(m),1);refresh();toast('Upload failed: '+e)}
}
function upl(inp){[...inp.files].forEach(f=>uploadOne(f));inp.value=''}
function murl(m,thumb){return APP.api+'/media?tok='+encodeURIComponent(TOK)+'&id='+m.id+(thumb?'&part=t':'')}
function tile(m,lab){let h;
 if(m._u)h=m.t=='v'?`<div class="vt">🎥</div>`:`<img src="${m._u}">`;
 else if(m.t=='v')h=`<div class="vt">🎥</div>`;
 else h=m.thumb?`<img src="${murl(m,1)}" loading="lazy">`:`<img src="${murl(m)}" loading="lazy">`;
 return `<div onclick="lbo('${m.id}')">${h}<span class="tag">${lab||''}${m.t=='v'?' ▶':''}</span></div>`}
function mediaHtml(l){const a=live().filter(m=>m.l==l);return a.length?a.map(m=>tile(m)).join(''):'<div class="empty" style="grid-column:1/-1;aspect-ratio:auto;background:none">No memories yet — add your first! 📸</div>'}
function lbo(id){const m=M.find(x=>x.id==id&&!x.del);if(!m)return;lbId=id;snd('tap');
 $('lbm').innerHTML=m.t=='v'?`<video src="${murl(m)}" controls autoplay playsinline></video>`:`<img src="${murl(m)}">`;
 const d=dByL(m.l);$('lbc').textContent=(d?d.t:'')+' · '+new Date(m.ts).toLocaleDateString();$('lb').style.display='flex'}
function delM(){const i=M.findIndex(m=>m.id==lbId);if(i<0)return;const m=M[i];
 if(m._u)M.splice(i,1);else{m.del=1;api('/del',{tok:TOK,id:m.id})}
 sv();snd('del');$('lb').style.display='none';$('lbm').innerHTML='';refresh()}

 $('htit').textContent=C.title||APP.name;document.title=C.title||APP.name}
function dlText(l){const s=S[l];if(!s||!s.dl||s.done)return'';
 const days=Math.ceil((+new Date(s.dl)-Date.now())/86400000);
 if(days<0)return'⚠️ '+(-days)+'d overdue';if(days==0)return'⏰ due today!';if(days==1)return'⏰ tomorrow';return'📅 '+days+'d left'}
function rGrid(){let dn=0;const tot=D().length;
 $('grid').innerHTML=D().map((d,i)=>{const s=st(d.l),on=!!s.done,n=cnt(d.l);dn+=on?1:0;
  const dl=dlText(d.l),due=dl.indexOf('overdue')>=0||dl.indexOf('today')>=0;
  return `<div class="c${on?' done':''}${due&&dl?' due':''}" style="--a:${d.a};--b:${d.b};animation-delay:${i*.03}s" onclick="openD(${i})"><span class="lt">${d.l.match(/^[A-Z]$/)?d.l:'✦'}</span><div class="em">${(d.e||'🎯').split(' ')[0]}</div><div class="tt">${d.t}</div><div class="ft"><span>${'❤️'.repeat(s.r||0)}</span><span>${n?'📷 '+n:''}</span></div>${dl?`<span class="dll">${dl}</span>`:''}<i class="ck">${on?'✓':''}</i></div>`}).join('');
 $('pb').style.width=(tot?dn/tot*100:0)+'%';$('pt').textContent=dn+' / '+tot+' dates done'+(tot&&dn==tot?' 🎉 Perfect!':'');
 rNext()}
function rNext(){const el=$('next');let best=null;
 D().forEach(d=>{const s=S[d.l];if(s&&s.dl&&!s.done){const t=+new Date(s.dl);if(!best||t<best.t)best={t:t,d:d}}});
 if(!best){const u=D().find(d=>!st(d.l).done);if(u)best={t:0,d:u}}
 if(!best){el.style.display='none';return}
 el.style.display='flex';
 const days=best.t?Math.ceil((best.t-Date.now())/86400000):null;
 const cd=best.t?(days<0?'⚠️ '+(-days)+' days overdue':days==0?'⏰ Due today!':days==1?'⏰ Due tomorrow':'⏳ '+days+' days to go'):'✨ Up next';
 el.innerHTML=`<div class="ne">${(best.d.e||'🎯').split(' ')[0]}</div><div><div class="nt">${best.d.l.match(/^[A-Z]$/)?best.d.l+' — ':''}${best.d.t}</div><div class="nd">${best.d.d||''}</div><div class="cd">${cd}</div></div>`;
 el.onclick=()=>{const i=D().indexOf(best.d);if(i>=0)openD(i)}}
function refresh(){rGrid();const v=$('fs').value||'*';$('fs').innerHTML='<option value="*">All memories ('+live().length+')</option>'+D().map(d=>`<option value="${d.l}">${d.t} (${cnt(d.l)})</option>`).join('');$('fs').value=v;rG();if(cur>=0)rDet()}
function rG(){const v=$('fs').value,a=live().filter(m=>v=='*'||m.l==v).sort((a,b)=>b.ts-a.ts);$('gg').innerHTML=a.length?a.map(m=>tile(m,m.l)).join(''):'<div class="empty" style="grid-column:1/-1;aspect-ratio:auto;background:none">Nothing here yet 🌸<br>Open a date and upload memories!</div>'}
function tab(n){snd('tap');$('n1').className=n==1?'on':'';$('n2').className=n==2?'on':'';$('grid').style.display=n==1?'grid':'none';$('gal').style.display=n==2?'block':'none';$('next').style.display=n==1?'flex':'none';if(n==1)rNext();if(n==2)rG()}

function rDet(){if(cur<0)return;const d=D()[cur],s=st(d.l),b=$('dnb');$('mg').innerHTML=mediaHtml(d.l);
 b.className='dn '+(s.done?'y':'');b.textContent=s.done?'✅ Done!':'⬜ Mark as done';

 if(document.activeElement!=$('dt'))$('dt').value=s.date||'';
 if(document.activeElement!=$('nt'))$('nt').value=s.note||'';
 if(document.activeElement!=$('dll'))$('dll').value=s.dl||'';
 const dt=dlText(d.l);$('dlt').textContent=dt}

 noteAct((on?'completed ':'unmarked ')+actName(d.l)+(on?' ❤️':''),d.l);rDet();
 if(on){boom();const all=D().every(x=>st(x.l).done);snd(all?'win':'done');if(all)setTimeout(()=>boom(90),500)}else snd('undo');rGrid()}

let mute=false,AC;
function snd(n){if(mute)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const q={tap:[[520,.04]],open:[[392,.07],[523,.07],[659,.1]],done:[[523,.09],[659,.09],[784,.09],[1047,.25]],undo:[[330,.07],[262,.1]],up:[[600,.06],[900,.1]],del:[[200,.15]],win:[[523,.1],[659,.1],[784,.1],[1047,.1],[1319,.1],[1568,.4]]}[n];let t=AC.currentTime;q.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.12);t+=d})}catch(e){}}
function boom(n){const t=C&&C.theme?C.theme:{g1:'#ff6ec4'};const cs=['#ff6ec4','#ffd86e','#7873f5','#4ade80','#38bdf8','#fff'];for(let i=0;i<(n||40);i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:50%;top:45%;background:${cs[i%6]};--x:${(Math.random()-.5)*600}px;--y:${(Math.random()-.3)*600}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),1700)}}

 const t=prompt('Name of the date:',d?d.t:'');if(!t)return;
 const ds=prompt('Short description (optional):',d?d.d||'':'');
 if(edit){d.e=em.trim()||d.e;d.t=t.trim();d.d=ds||''}
 else{const pal=[['#ff4d8d','#6a11cb'],['#00c6ff','#0072ff'],['#11998e','#38ef7d'],['#f2994a','#eb5757'],['#c86dd7','#3023ae'],['#43cea2','#185a9d']];const p=pal[D().length%pal.length];
  C.dates.push({l:'c'+uid(),e:em.trim()||'🎈',t:t.trim(),d:ds||'',a:p[0],b:p[1]})}
 C.cu=Date.now();cfgDirty=true;sv();buildGrid();refresh();if(edit)closeD();snd('done');toast(edit?'Idea updated ✏️':'Idea added! 🎉')}

/* ====== settings ====== */
async function setView(){snd('tap');show('set');const s=$('set');if(!C){s.innerHTML='<div class="empty">Loading…</div>';return}
 const r=await api('/devices',{tok:TOK});
 s.innerHTML=`<h2 style="text-align:center">⚙️ Settings</h2>
 <div class="card"><h3>Couple</h3>
  <div class="hint">Adventure title</div><input type="text" id="sti" value="${C.title||''}">
  <div class="hint" style="margin-top:8px">Names</div><div class="row2"><input type="text" id="sn1" value="${(C.names||[])[0]||''}"><input type="text" id="sn2" value="${(C.names||[])[1]||''}"></div>
  <div class="hint" style="margin-top:8px">Couple emoji</div><input type="text" id="sem" value="${C.emoji||'💑'}" style="max-width:90px;text-align:center;font-size:22px">
  <button class="btn" onclick="saveSet()">Save changes</button></div>
 <div class="card"><h3>Color scheme</h3>
  <div class="swrow">${THEMES.map((t,i)=>`<div class="sw ${C.theme&&C.theme.g1==t.g1?'on':''}" style="background:linear-gradient(135deg,${t.g1},${t.g2})" title="${t.n}" onclick="C.theme={g1:'${t.g1}',g2:'${t.g2}',light:${t.light}};C.cu=Date.now();cfgDirty=true;applyTheme();sv();setView()"></div>`).join('')}
  <div class="sw" style="background:linear-gradient(135deg,${C.theme.g1},${C.theme.g2});display:grid;place-items:center;font-size:11px;color:#fff;text-shadow:0 1px 3px #000" onclick="customTheme()">Custom</div></div></div>
 <div class="card"><h3>Date ideas (${D().length})</h3><div class="hint">Tap one to edit or delete</div>
  ${D().map((d,i)=>`<div class="erow"><span class="e">${(d.e||'🎯').split(' ')[0]}</span><b style="width:18px">${d.l.match(/^[A-Z]$/)?d.l:'✦'}</b><span style="flex:1">${d.t}</span><span style="cursor:pointer" onclick="ideaForm(${i})">✏️</span><span style="cursor:pointer" onclick="delIdea(${i})">🗑</span></div>`).join('')}
  <button class="btn ghost" onclick="ideaForm()">＋ Add an idea</button></div>
 <div class="card" id="pair"><h3>🔗 Pairing</h3><div class="hint">Devices linked to this couple (max 2). Removing a device blocks it instantly and frees the slot.</div>
  ${r.ok?r.devices.map(d=>`<div class="dvrow">📱 <b>${d.name||'Unnamed'}</b>${d.self?' <span class="chip">this phone</span>':''}<button onclick="removeDev('${d.did}','${(d.name||'').replace(/'/g,'')}')">Remove</button></div>`).join(''):'<div class="empty">Could not load devices</div>'}
  ${r.ok&&r.devices.length<2?`<div id="pcode" style="text-align:center;margin-top:10px"></div><button class="btn" onclick="genCode()">Generate pairing code</button>`:'<div class="hint" style="margin-top:8px">Couple is full (2 devices). Remove one to pair a new phone.</div>'}
 </div>
 <div class="card"><h3>🔔 Notifications</h3><div class="hint">Real alerts on both phones, even with the app closed. Deadline reminders included.</div>
  <button class="btn" onclick="enableAlerts()">Turn on notifications</button></div>
 <button class="btn ghost" onclick="show('main');refresh()">← Back to our dates</button>
 <div style="text-align:center;opacity:.5;font-size:11px;margin-top:24px">${APP.name} · private by design · your data syncs only between your two phones</div>`}
function customTheme(){const g1=prompt('Top color (hex, e.g. #1a1030):',C.theme.g1);if(!g1)return;const g2=prompt('Bottom color (hex):',C.theme.g2);if(!g2)return;
 C.theme={g1:g1,g2:g2,light:confirm('Light theme (dark text)? OK = light, Cancel = dark')};C.cu=Date.now();cfgDirty=true;applyTheme();sv();setView()}
function saveSet(){C.title=$('sti').value.trim()||C.title;C.names=[$('sn1').value.trim(),$('sn2').value.trim()];
 const em=[...$('sem').value.trim()];if(em.length)C.emoji=em.join('');
 C.cu=Date.now();cfgDirty=true;sv();rHead();toast('Saved ✔');setView()}
function delIdea(i){const d=D()[i];if(!confirm('Delete "'+d.t+'"? Its photos stay in the gallery.'))return;
 C.dates.splice(i,1);C.cu=Date.now();cfgDirty=true;sv();setView();toast('Idea deleted')}
async function genCode(){const r=await api('/newcode',{tok:TOK});
 if(!r.ok){toast(r.err||'Could not create a code');return}
 const link=APP.site+'#join='+r.code;
 $('pcode').innerHTML=`<div class="bigcode">${r.code}</div><img id="qr2" style="background:#fff;border-radius:18px;padding:12px;width:190px" alt="QR">
 <div class="cdn">Single-use · expires in 15:00<br><a href="${link}" style="color:var(--acc2)">${link}</a></div>`;
 try{const q=qrcode(0,'M');q.addData(link);q.make();$('qr2').src=q.createDataURL(6,6)}catch(e){$('qr2').style.display='none'}}
async function removeDev(did,name){if(!confirm('Remove '+(name||'this device')+'? It loses access instantly.'))return;
 const r=await api('/remove',{tok:TOK,did:did});
 if(r.ok){toast('Removed');if(r.self){localStorage.removeItem('cbaTok');localStorage.removeItem('cbaD');location.reload()}else setView()}else toast(r.err||'Failed')}

/* ====== boot ====== */
function buildGrid(){}
function openByL(l){const i=D().findIndex(d=>d.l==l);if(i>=0)openD(i)}
if(TOK){enterMain();
 // wait for first sync to have config, then honor deep link
 const dl=(location.hash.match(/d=([A-Za-z0-9_-]+)/)||[])[1];
 if(dl){const iv=setInterval(()=>{if(D().length){clearInterval(iv);openByL(dl)}},500);setTimeout(()=>clearInterval(iv),8000)}
}else{const hc=(location.hash.match(/join=([A-Z2-9]{6})/i)||[])[1];wiz(hc?9:0)}
if("serviceWorker" in navigator)window.addEventListener("load",()=>{navigator.serviceWorker.register("./service-worker.js").catch(()=>{})});
</script></body></html>

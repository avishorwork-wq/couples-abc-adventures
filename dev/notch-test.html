<!doctype html><meta charset="utf-8"><title>notch-free decode accuracy</title>
<body><pre id="out">running</pre><canvas id="view" style="max-width:300px;image-rendering:pixelated"></canvas>
<script src="prism.js"></script>
<script src="prism-nogap.js"></script>
<script>
async function run(){
const out=[],logs=[];
const payloads=['https://avishorwork-wq.github.io/couples-abc-adventures/#/join=K7QX2M','https://avishorwork-wq.github.io/couples-abc-adventures/#/join=B4T8ZD'];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function renderFlat(code){const c=Prism.render(code,8);const f=document.createElement('canvas');
  f.width=c.width;f.height=c.height;const g=f.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,f.width,f.height);g.drawImage(c,0,0);return f;}
function rotate(src,quarter){const s=quarter%2?src.height:src.width,t=quarter%2?src.width:src.height;
  const c=document.createElement('canvas');c.width=s;c.height=t;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,s,t);g.translate(s/2,t/2);g.rotate(quarter*Math.PI/2);g.drawImage(src,-src.width/2,-src.height/2);return c;}
function degrade(src,kind,seed){
  if(kind==='blur'){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;
    const g=c.getContext('2d');g.filter='blur(1.5px)';g.drawImage(src,0,0);
    return g.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height);}
  if(kind==='small'){const c=document.createElement('canvas');c.width=Math.round(src.width*0.55);c.height=Math.round(src.height*0.55);
    const g=c.getContext('2d');g.drawImage(src,0,0,c.width,c.height);
    const c2=document.createElement('canvas');c2.width=src.width;c2.height=src.height;
    c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);
    return c2.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c2.width,c2.height);}
  return null;}
function noise(src,level,seed){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;
  const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(src,0,0);
  if(!level)return g.getImageData(0,0,c.width,c.height);
  const id=g.getImageData(0,0,c.width,c.height),d=id.data,r=rng(seed);
  for(let i=0;i<d.length;i+=4){const n=(r()+r()+r()-1.5)*2*level*255;
    d[i]=Math.min(255,Math.max(0,d[i]+n));d[i+1]=Math.min(255,Math.max(0,d[i+1]+n));d[i+2]=Math.min(255,Math.max(0,d[i+2]+n));}
  return id;}
for(const variant of ['stock','nogap']){
  let pass=0,total=0,fails=[];
  for(const payload of payloads){
    const bytes=new TextEncoder().encode(payload);
    const code=(variant==='stock'?Prism:PrismNG).encode(bytes,{});
    const flat=renderFlat(code);
    for(let rot=0;rot<4;rot++){
      const rc=rotate(flat,rot);
      for(const cond of ['clean','n0.03','n0.06','blur','small']){
        total++;
        let id;
        if(cond==='blur'||cond==='small'){id=degrade(rc,cond);}
        else{const level=cond==='clean'?0:parseFloat(cond.slice(1));id=noise(rc,level,rot*100+level*1e6+payload.length);}
        try{
          const res=Prism.readImage({width:rc.width,height:rc.height,data:id.data});
          const text=new TextDecoder().decode(res.bytes);
          if(text===payload)pass++;else fails.push(rot*90+'deg/'+cond+' wrong-text');
        }catch(e){fails.push(rot*90+'deg/'+cond+' '+e.message.slice(0,40));}
      }
    }
  }
  out.push(variant+': '+pass+'/'+total+' passed'+(fails.length?' fails: '+fails.slice(0,6).join(' | '):''));
}
document.getElementById('out').textContent=out.join('\n');
window.__done=true;
}
run().catch(e=>{document.getElementById('out').textContent='HARNESS ERROR '+e.message;window.__done=true;});
</script>

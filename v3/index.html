<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alphabet Us - A to Z, together</title>
<meta name="description" content="A private A-to-Z of dates for the two of you. Plan it, do it, keep the photo.">
<meta name="theme-color" content="#1c0363">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@font-face{font-family:'Inter';src:url('fonts/inter-var.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Fraunces';src:url('fonts/fraunces-var.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Fraunces';src:url('fonts/fraunces-it-var.woff2') format('woff2');font-weight:100 900;font-style:italic;font-display:swap}
:root{
  --p:#1c0363; --a:#f8519b;
  --font-ui:'Inter',-apple-system,system-ui,sans-serif;
  --font-display:'Fraunces',Georgia,serif;
  --r-s:10px; --r-m:16px; --r-l:24px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --shadow-1:0 1px 2px rgb(20 10 40/.06),0 2px 8px rgb(20 10 40/.05);
  --shadow-2:0 4px 16px rgb(20 10 40/.10),0 12px 40px rgb(20 10 40/.08);
  --ease:cubic-bezier(.32,.72,.24,1);
}
:root,[data-mode=light]{
  color-scheme:light;
  --bg:color-mix(in oklab,#ffffff 96%,var(--p));
  --bg-raise:#ffffff;
  --bg-sunk:color-mix(in oklab,#ffffff 92%,var(--p));
  --ink:color-mix(in oklab,#17111f 88%,var(--p));
  --ink-2:color-mix(in oklab,var(--ink) 62%,var(--bg));
  --ink-3:color-mix(in oklab,var(--ink) 40%,var(--bg));
  --line:color-mix(in oklab,var(--ink) 10%,var(--bg));
  --line-2:color-mix(in oklab,var(--ink) 16%,var(--bg));
  --p-wash:color-mix(in oklab,var(--p) 8%,var(--bg));
  --a-wash:color-mix(in oklab,var(--a) 12%,var(--bg));
  --a-ink:color-mix(in oklab,var(--a) 78%,#000 6%);
  --good:#2e9e5b; --warn:#c47d1a; --bad:#d2445a;
  --scrim:rgb(20 10 40/.44);
}
[data-mode=dark]{
  color-scheme:dark;
  --bg:color-mix(in oklab,#0d0a14 92%,var(--p));
  --bg-raise:color-mix(in oklab,#17131f 90%,var(--p));
  --bg-sunk:color-mix(in oklab,#080610 94%,var(--p));
  --ink:color-mix(in oklab,#f4f1fa 92%,var(--a));
  --ink-2:color-mix(in oklab,var(--ink) 64%,var(--bg));
  --ink-3:color-mix(in oklab,var(--ink) 42%,var(--bg));
  --line:color-mix(in oklab,var(--ink) 12%,var(--bg));
  --line-2:color-mix(in oklab,var(--ink) 20%,var(--bg));
  --p-wash:color-mix(in oklab,var(--p) 26%,var(--bg));
  --a-wash:color-mix(in oklab,var(--a) 18%,var(--bg));
  --a-ink:color-mix(in oklab,var(--a) 88%,#fff 8%);
  --scrim:rgb(4 2 10/.6);
  --shadow-1:0 1px 2px rgb(0 0 0/.3);
  --shadow-2:0 4px 16px rgb(0 0 0/.4),0 12px 40px rgb(0 0 0/.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-ui);font-size:16px;line-height:1.5;color:var(--ink);
  background:var(--bg);min-height:100dvh;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(120vw 90vh at 85% -20%,color-mix(in oklab,var(--a) 14%,transparent),transparent 60%),
    radial-gradient(100vw 80vh at -20% 110%,color-mix(in oklab,var(--p) 16%,transparent),transparent 60%);
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img,canvas,video{max-width:100%;display:block}
a{color:var(--a-ink)}
::selection{background:color-mix(in oklab,var(--a) 30%,transparent)}
:focus-visible{outline:2px solid var(--a-ink);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--font-display);font-weight:560;line-height:1.12;letter-spacing:-.01em}
.serif-i{font-style:italic;font-weight:480}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  padding:14px 20px;border-radius:14px;font-weight:600;font-size:15.5px;line-height:1;
  transition:transform .14s var(--ease),box-shadow .14s var(--ease),background .14s;
  -webkit-tap-highlight-color:transparent;user-select:none}
.btn:active{transform:scale(.97)}
.btn-primary{color:#fff;background:linear-gradient(135deg,var(--p),color-mix(in oklab,var(--p) 52%,var(--a)));
  box-shadow:0 2px 10px color-mix(in oklab,var(--p) 40%,transparent)}
.btn-soft{background:var(--p-wash);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-danger{background:color-mix(in oklab,var(--bad) 12%,var(--bg-raise));color:var(--bad)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--sp-4)}
.field label{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.input,textarea.input,select.input{
  padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg-raise);font-size:16px;width:100%;
  transition:border-color .15s,box-shadow .15s}
.input:focus{outline:0;border-color:var(--a-ink);box-shadow:0 0 0 3px color-mix(in oklab,var(--a) 22%,transparent)}
.input::placeholder{color:var(--ink-3)}
.card{background:var(--bg-raise);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-1)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  font-size:12px;font-weight:600;background:var(--a-wash);color:var(--a-ink)}
.icon{width:20px;height:20px;flex:none}
.icon-lg{width:24px;height:24px}
/* ---------- layout shell ---------- */
#view{min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;width:100%;max-width:460px;margin:0 auto;
  padding:calc(var(--sp-5) + env(safe-area-inset-top)) var(--sp-5) calc(92px + env(safe-area-inset-bottom))}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* entrances stay hidden until the first real paint (.booted) so the stagger plays
   visibly instead of running during page load */
.screen>*{opacity:0}
html.booted .screen>*{animation:rise .55s cubic-bezier(.22,1,.36,1) forwards}
.screen>*:nth-child(1){animation-delay:.02s}
.screen>*:nth-child(2){animation-delay:.10s}
.screen>*:nth-child(3){animation-delay:.18s}
.screen>*:nth-child(4){animation-delay:.26s}
.screen>*:nth-child(5){animation-delay:.33s}
.screen>*:nth-child(6){animation-delay:.40s}
.screen>*:nth-child(7){animation-delay:.46s}
.screen>*:nth-child(n+8){animation-delay:.52s}
.screen .stag>*{opacity:0}
html.booted .screen .stag>*{animation:rise .55s cubic-bezier(.22,1,.36,1) forwards}
.screen .stag>*:nth-child(1){animation-delay:.30s}
.screen .stag>*:nth-child(2){animation-delay:.40s}
.screen .stag>*:nth-child(n+3){animation-delay:.48s}
@keyframes tilein{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
.az-tile{opacity:0}
html.booted .az-tile{animation:tilein .55s cubic-bezier(.22,1,.36,1) forwards}

@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(min-width:960px){
  .screen{max-width:680px}
  .screen-wide{max-width:1060px;padding-left:var(--sp-7);padding-right:var(--sp-7)}
}
.topbar{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-5)}
.topbar .spacer{flex:1}
.wordmark{font-family:var(--font-display);font-weight:560;font-size:20px;letter-spacing:-.01em}
.wordmark em{font-style:italic;font-weight:480;color:var(--a-ink)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  color:var(--ink-2);background:transparent;transition:background .15s}
.iconbtn:hover{background:var(--p-wash)}
.h1{font-size:30px;margin-bottom:var(--sp-2)}
.sub{color:var(--ink-2);font-size:15px;margin-bottom:var(--sp-5)}
/* ---------- A-Z grid ---------- */
.az{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--sp-3)}
@media(min-width:960px){.az{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:var(--sp-4)}}
.az-tile{position:relative;aspect-ratio:1;border-radius:var(--r-m);background:var(--bg-raise);
  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .15s var(--ease),box-shadow .15s;box-shadow:var(--shadow-1)}
.az-tile:active{transform:scale(.96)}
@media(hover:hover){.az-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.next-card:hover{transform:translateY(-1px)}
.gal figure:hover{filter:brightness(1.04)}}
.az-tile .L{font-family:var(--font-display);font-size:36px;font-weight:560;color:var(--ink)}
.az-tile .idea{font-size:11px;color:var(--ink-3);text-align:center;padding:0 6px;line-height:1.25;
  max-width:100%;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;word-break:break-word}
.az-tile.done{background:linear-gradient(150deg,color-mix(in oklab,var(--p) 14%,var(--bg-raise)),color-mix(in oklab,var(--a) 16%,var(--bg-raise)));
  border-color:color-mix(in oklab,var(--a) 30%,var(--line))}
.az-tile.done .L{color:var(--a-ink)}
.az-tile.done .idea{min-height:27.5px}
.az-tile .tick{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;
  background:var(--a-ink);color:#fff;display:grid;place-items:center}
.az-tile .stars{font-size:9px;letter-spacing:2px;color:var(--a-ink);line-height:1}
.hero{display:flex;flex-direction:column;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.hero-top{display:flex;align-items:flex-start;gap:12px}
.hero-title{font-family:var(--font-display);font-size:30px;font-weight:560;line-height:1.1;letter-spacing:-.01em}
.hero-sub{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.pbar{height:5px;border-radius:3px;background:color-mix(in oklab,var(--p) 12%,var(--bg-raise));overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--p),color-mix(in oklab,var(--p) 52%,var(--a)));transition:width .8s cubic-bezier(.22,1,.36,1)}
.next-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;border:0;cursor:pointer;
  border-radius:var(--r-m);background:linear-gradient(135deg,var(--p),color-mix(in oklab,var(--p) 52%,var(--a)));color:#fff;
  box-shadow:0 8px 24px -8px color-mix(in oklab,var(--p) 55%,transparent)}
.next-card:active{transform:scale(.98)}
.next-card .nL{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:30px;line-height:1;
  width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.next-card .nT{flex:1;min-width:0}
.next-card .nK{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.next-card .nI{display:block;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.next-card .nA{opacity:.9;flex:none}
/* ---------- bottom nav ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;background:color-mix(in oklab,var(--bg-raise) 86%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;
  font-size:11px;font-weight:600;color:var(--ink-3);border-radius:12px;position:relative}
@media(max-width:959px){
.tabbar button::before{content:'';position:absolute;inset:2px 22px;border-radius:12px;
  background:var(--a-wash);opacity:0;transform:scale(.82);
  transition:opacity .24s var(--ease),transform .24s var(--ease)}
.tabbar button.on::before{opacity:1;transform:scale(1)}}
.tabbar button.on{color:var(--a-ink)}
.tabbar button>*{position:relative}
@media(min-width:960px){
  .tabbar{position:fixed;left:0;top:0;bottom:0;width:216px;flex-direction:column;justify-content:flex-start;
    gap:4px;border-top:0;border-right:1px solid var(--line);padding:var(--sp-5) var(--sp-3);backdrop-filter:none}
  .tabbar button{flex:none;flex-direction:row;justify-content:flex-start;gap:var(--sp-3);
    padding:11px 14px;font-size:14px}
  .tabbar button.on{background:var(--a-wash)}
  body.has-app #view{padding-left:216px}
  body.has-app .screen{padding-bottom:var(--sp-6)}
}

/* ---------- sheet (letter detail) ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;
  transition:opacity .25s var(--ease);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg-raise);
  border-radius:var(--r-l) var(--r-l) 0 0;box-shadow:var(--shadow-2);
  max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(102%);transition:transform .34s var(--ease);
  padding:var(--sp-4) var(--sp-5) calc(var(--sp-5) + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:var(--line-2);margin:2px auto var(--sp-4)}
.sheet-L{display:flex;align-items:baseline;gap:var(--sp-3);margin-bottom:var(--sp-2)}
.sheet-L .big{font-family:var(--font-display);font-size:52px;font-weight:560;line-height:1;
  background:linear-gradient(135deg,var(--p),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.chiprow{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin:var(--sp-3) 0}
.chip{padding:7px 12px;border-radius:999px;background:var(--p-wash);font-size:13px;font-weight:500;color:var(--ink-2)}
.starpick{display:flex;gap:2px;font-size:26px;color:var(--line-2)}
.starpick button{color:inherit;transition:transform .12s;width:40px;height:40px;display:grid;place-items:center}
.starpick button.on{color:var(--a-ink)}
.starpick button:active{transform:scale(1.2)}
@keyframes starpop{0%{transform:scale(1)}40%{transform:scale(1.45) rotate(-10deg)}100%{transform:scale(1) rotate(0)}}
.starpick button.pop{animation:starpop .38s var(--ease)}
/* ---------- gallery ---------- */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:var(--r-m);overflow:hidden}
.gal figure{opacity:0}
html.booted .gal figure{animation:rise .45s cubic-bezier(.22,1,.36,1) forwards}
@keyframes donepop{0%{transform:scale(1)}35%{transform:scale(1.07)}100%{transform:scale(1)}}
html.booted .az-tile.just-done{animation:rise .45s cubic-bezier(.22,1,.36,1) forwards,donepop .55s var(--ease) .45s}
@media(min-width:960px){.gal{grid-template-columns:repeat(5,1fr);gap:6px}}
.gal figure{aspect-ratio:1;background:var(--bg-sunk);position:relative;overflow:hidden}
.gal img,.gal video{width:100%;height:100%;object-fit:cover}
.gal .badge{position:absolute;right:5px;bottom:5px;width:22px;height:22px;border-radius:8px;
  background:rgb(0 0 0/.55);color:#fff;display:grid;place-items:center}
.gal .lettertag{position:absolute;left:5px;top:5px;padding:2px 8px;border-radius:99px;
  background:rgb(0 0 0/.55);color:#fff;font-size:11px;font-weight:600}
/* ---------- settings ---------- */
.set-group{margin-bottom:var(--sp-6)}
.set-group>h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:var(--sp-3);font-family:var(--font-ui)}
.set-row{display:flex;align-items:center;gap:var(--sp-3);padding:14px 16px;
  background:var(--bg-raise);border:1px solid var(--line)}
.set-row:first-child{border-radius:var(--r-m) var(--r-m) 0 0}
.set-row:last-child{border-radius:0 0 var(--r-m) var(--r-m)}
.set-row:only-child{border-radius:var(--r-m)}
.set-row+.set-row{border-top:0}
.set-row .grow{flex:1;min-width:0}
.set-row .t{font-weight:600;font-size:15px}
.set-row .d{font-size:13px;color:var(--ink-3)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:6px 2px}
.swatch{width:44px;height:44px;border-radius:14px;border:2px solid transparent;cursor:pointer;
  transition:transform .12s}
.swatch.on{border-color:var(--ink);transform:scale(1.06)}
input[type=color].colpick{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);
  padding:2px;background:var(--bg-raise);cursor:pointer}
/* ---------- prism invite card ---------- */
.pcard{position:relative;background:var(--bg-raise);border-radius:28px;padding:22px 22px 18px;
  box-shadow:var(--shadow-2);border:1px solid color-mix(in oklab,var(--p) 14%,transparent)}
.pcard::before{content:'';position:absolute;inset:6px;border-radius:22px;pointer-events:none;
  border:1.5px solid transparent;
  background:linear-gradient(135deg,color-mix(in oklab,var(--p) 55%,transparent),color-mix(in oklab,var(--a) 55%,transparent)) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.pcard .names{text-align:center;font-family:var(--font-display);font-size:19px;font-weight:560;margin-bottom:14px}
.pcard .names em{font-style:italic;font-weight:480;color:var(--a-ink)}
.pcard canvas{width:100%;height:auto;display:block;border-radius:14px}
.pcard .tag{display:block;width:max-content;margin:8px auto 0;font-size:10.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);background:var(--p-wash);
  padding:3px 10px;border-radius:999px}
.bigcode{font-family:var(--font-display);font-size:30px;font-weight:560;letter-spacing:.22em;padding-left:.22em}
/* ---------- empty states / misc ---------- */
.empty{text-align:center;padding:var(--sp-7) var(--sp-5);color:var(--ink-3)}
.empty .art{width:88px;height:88px;margin:0 auto var(--sp-4);border-radius:28px;
  background:linear-gradient(135deg,var(--p-wash),var(--a-wash));display:grid;place-items:center;color:var(--a-ink)}
.empty .t{font-family:var(--font-display);font-size:20px;font-weight:560;color:var(--ink);margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;
  opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:90;box-shadow:var(--shadow-2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid color-mix(in oklab,currentColor 25%,transparent);
  border-top-color:currentColor;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.center-wrap{flex:1;display:flex;flex-direction:column;justify-content:center}
.fadein{animation:screen-in .3s var(--ease)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>
</head>
<body>
<div id="view"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<script src="prism.js?v=9"></script>
<script src="scanfx.js?v=8"></script>
<script src="styled.js"></script>
<script src="icon-recolor.js"></script>
<script>
'use strict';
/* Alphabet Us - a private A-Z of dates for two. */
const API='https://couples-api.avishorwork.workers.dev';
const VAPID_PUB='BM6373UlQ6TpTz2oyPZ_r5HPvUmPgmUQIwSWCN8n2AnH3da04TSgQbhGUVN8kZglt40-orkBe_vtnqoBmTeb9xQ';
const urlB64=s=>{const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0));};
const LS='au_';

/* ---------- back navigation: Android/Samsung back steps back inside the app ---------- */
const Nav=(()=>{
  let stack=[],skipPop=false;
  const inApp=()=>current==='app';
  function arm(){ /* keep a guard entry under the app so Back at the first screen stays in-app */
    if(!inApp())return;
    if(!history.state||!history.state.g){
      try{history.replaceState({g:'base'},'');history.pushState({g:'guard'},'');}catch(e){}
    }
  }
  function pushState(tag){try{history.pushState({g:'l',t:tag},'');}catch(e){}}
  function pushTab(t){
    if(!inApp()||state.tab===t){state.tab=t;renderApp();return;}
    stack.push({type:'tab',prev:state.tab});
    pushState('tab');
    state.tab=t;renderApp();
  }
  function pushOverlay(close){const layer={type:'ov',close};stack.push(layer);pushState('ov');return layer;}
  function removeLayer(l){ /* explicit close control used: consume its history entry */
    const i=stack.lastIndexOf(l);if(i<0)return;
    stack.splice(i,1);skipPop=true;history.back();
  }
  function closeTop(l){removeLayer(l);l.close();}
  function reset(){stack=[];}
  addEventListener('popstate',e=>{
    if(skipPop){skipPop=false;return;}
    const top=stack.pop();
    if(top){
      if(top.type==='tab'){state.tab=top.prev;renderApp();}
      else top.close();
      return;
    }
    if(inApp()&&e.state&&e.state.g==='base'){
      try{history.pushState({g:'guard'},'');}catch(e){}
    }
  });
  return {arm,pushTab,pushOverlay,removeLayer,closeTop,reset};
})();

    vid.srcObject=scanStream;await vid.play();
    const cap=document.createElement('canvas');const cx=cap.getContext('2d',{willReadFrequently:true});
    const dec=document.createElement('canvas');const dxc=dec.getContext('2d',{willReadFrequently:true}); /* full-resolution frame for worker reads; detection stays on the cheap 640px downscale */
    const quadArea=q=>{let a=0;for(let i=0;i<4;i++){const p=q[i],r=q[(i+1)%4];a+=p[0]*r[1]-r[0]*p[1];}return Math.abs(a)/2;};
    const quadDist=(a,b)=>{let best=1e18;for(let r=0;r<4;r++){let d=0;for(let i=0;i<4;i++)d+=Math.hypot(a[i][0]-b[(i+r)%4][0],a[i][1]-b[(i+r)%4][1]);best=Math.min(best,d/4);}return best;};
    const capToStage=(p,W,H)=>{const s2=Math.max(innerWidth/W,innerHeight/H);return [p[0]*s2+(innerWidth-W*s2)/2,p[1]*s2+(innerHeight-H*s2)/2];};
    let lastQuad=null,stab=0,decoding=false,tickN=0;
    const tick=async()=>{
      if(closed||scanStream!==stream)return; /* a closed or superseded session's loop dies here */
      if(scanBusy||vid.readyState<2||!vid.videoWidth){requestAnimationFrame(tick);return;}
      scanBusy=true;
      const sc=Math.min(1,640/vid.videoWidth);
      cap.width=Math.round(vid.videoWidth*sc);cap.height=Math.round(vid.videoHeight*sc);
      cx.drawImage(vid,0,0,cap.width,cap.height);
      let id=null;
      try{id=cx.getImageData(0,0,cap.width,cap.height);}catch(e){}
      /* 1) cheap detection pass -> live tracking brackets on the real quad */
      let quad=null;
      if(id){try{Prism.beginDecode(700);const f=Prism.frame(id);const qs=Prism.detectCurved(f);
        if(qs&&qs.length){
          /* rank candidates by the decoder's own hypothesis score: a real code's cells
             match the format; background shapes score near zero */
          qs.sort((a,b)=>quadArea(b)-quadArea(a));
          /* cluster near-duplicate contours (one code yields several outlines at
             slightly different sizes) and score one per cluster: the true code's
             quad is often NOT among the largest raw quads (its outer card/ring
             contours are bigger), so a raw top-3 slice starves it */
          const clusters=[];
          for(const q0 of qs){
            if(clusters.some(cl=>quadDist(cl.q,q0)<cap.width*.02&&quadArea(cl.q)/quadArea(q0)>0.55&&quadArea(cl.q)/quadArea(q0)<1.8))continue;
            clusters.push({q:q0});
            if(clusters.length>=6)break;
          }
          const cand=[];
          for(const cl of clusters){
            let best=0;
            /* cheapest layout first: the invite encoder picks size 0 for the
               82-byte join URL, and a strong early hit needs no further work */
            outer:
            for(const size of [0,1,2]){const lay=Prism.layout(size);
              for(let rot=0;rot<4;rot++){const q=cl.q.map((_,i)=>cl.q[(i+rot)%4]);
                const h=Prism.homography(Prism.corners(lay),q);
                const sc=Prism.hypothesisScore(f,h,lay,0,Prism.whiteBalance(f,h,lay),true);
                if(sc.score>best)best=sc.score;
                if(best>=0.9)break outer;}}
            if(best>=0.45)cand.push({q:cl.q,sc:best});
          }
          if(cand.length){
            cand.sort((a,b)=>b.sc-a.sc);
            let pick=cand[0];
            if(lastQuad){const near=cand.find(c=>quadDist(c.q,lastQuad)<cap.width*.08);if(near)pick=near;}
            quad=pick.q;
          }
        }}catch(e){}}
      if(quad){
        const d=lastQuad?quadDist(quad,lastQuad):1e9;
        stab=(lastQuad&&d<cap.width*.08)?Math.min(4,stab+1):1;
        lastQuad=quad.map(p=>[p[0],p[1]]);
        /* adopt a detection on screen only once it repeats (kills one-frame false
           positives); confidence grows with stability */
        if(stab>=2||verifiedOk)fx.track(quad.map(p=>capToStage(p,cap.width,cap.height)),verifiedOk?1:Math.min(1,(stab-2)/2));
      }else{lastQuad=null;stab=0;fx.track(null,0);}
      /* 2) full decode in the worker (frame-fused) once a candidate is in view */
      tickN++;
      /* while verified, keep reading fresh frames: the Verified state must always
         reflect the CURRENT frame, never a stale read kept alive by the timer */
      if(id&&!decoding&&((verifiedOk&&Date.now()<verifyDeadline)||(!verifiedOk&&(quad||tickN%6===0)))){
        decoding=true;
        /* candidate reads decode a FULL-resolution frame: the 640px detection
           downscale blurs a dense code's cells together before the reader sees
           them. Blind probes keep the cheap downscaled frame they already use. */
        let rid=id, capW=cap.width, capH=cap.height;
        if(quad||verifiedOk){
          dec.width=vid.videoWidth;dec.height=vid.videoHeight;
          dxc.drawImage(vid,0,0,dec.width,dec.height);
          let fid=null;try{fid=dxc.getImageData(0,0,dec.width,dec.height);}catch(e){}
          if(fid){rid=fid;capW=dec.width;capH=dec.height;}
        }
        const reqStream=scanStream; /* bind this request's capture session + dims */
        const revoke=()=>{verifiedOk=false;verifiedText=null;clearTimeout(verifyTimer);fx.revoke();};
        AsyncPrismReader.read(rid,{fusion:true}).then(res=>{
          decoding=false;
          if(closed||scanStream!==reqStream)return; /* discard results from a closed/reopened session */
          const text=new TextDecoder().decode(res.bytes||[]);
          const m=/#\/join=([A-Z2-9]{6})/.exec(text);
          if(verifiedOk){
            if(m&&text===verifiedText){fx.track(res.quad.map(p=>capToStage(p,capW,capH)),1);}
            else revoke(); /* changed or unreadable code clears Verified */
            return;
          }
          if(!m)return;
          window.__lastDecode={quad:res.quad.map(p=>[p[0],p[1]]),lw:res.layout.W,lh:res.layout.H,capW,capH,fused:res.fusedFrames||0};
          /* live success: camera keeps running; brackets tighten on the real code
             in the live view and keep tracking it until the sheet closes */
          verifiedOk=true;verifiedText=text;
          fx.track(res.quad.map(p=>capToStage(p,capW,capH)),1);
          fx.verified('Verified');
          /* close only after the window AND the last in-flight read settle:
             a stale success must never fill the form while a newer read is pending */
          verifyDeadline=Date.now()+1400;
          const tryClose=()=>{
            if(closed||!verifiedOk)return;
            if(Date.now()<verifyDeadline||decoding){verifyTimer=setTimeout(tryClose,150);return;}
            cleanup();
            $('#scanBox').style.display='none';
            $('#code').value=m[1];toast('Code found');
          };
          verifyTimer=setTimeout(tryClose,1400);
        },()=>{decoding=false;if(verifiedOk&&!closed&&scanStream===reqStream)revoke();});
      }
      scanBusy=false;
      setTimeout(tick,110);
    };
    tick();
  }catch(e){
    scanFail('Camera unavailable');
  }
}

/* ---------- media upload (chunked, matches worker /up) ---------- */
async function compressImage(file){
  const bmp=await createImageBitmap(file);
  const scale=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  cv.getContext('2d').drawImage(bmp,0,0,w,h);
  const th=document.createElement('canvas');
  const ts=Math.min(1,420/Math.max(w,h));
  th.width=Math.round(w*ts);th.height=Math.round(h*ts);
  th.getContext('2d').drawImage(cv,0,0,th.width,th.height);
  const full=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));
  const thumb=await new Promise(r=>th.toBlob(r,'image/jpeg',.7));
  return {full,thumb,mime:'image/jpeg'};
}
function b64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(blob);});}
async function uploadMedia(L,file){
  const isVideo=file.type.startsWith('video/');
  if(isVideo&&file.size>8*1024*1024)throw new Error('Videos up to 8 MB');
  if(!isVideo&&!file.type.startsWith('image/'))throw new Error('Photos or videos only');
  const id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const ts=Date.now();
  const mime=isVideo?file.type:'image/jpeg';
  const CH=950000;
  let data,size,thumb=null;
  if(isVideo){
    data=await b64(file);size=file.size;
  }else{
    const c=await compressImage(file);
    data=await b64(c.full);size=c.full.size;thumb=await b64(c.thumb);
  }
  if(thumb)await api('/up',{tok:state.tok,id,part:'t',data:thumb,size});
  const n=Math.max(1,Math.ceil(data.length/CH));
  for(let i=0;i<n;i++){
    const last=i===n-1;
    await api('/up',{tok:state.tok,id,part:String(i),data:data.slice(i*CH,(i+1)*CH),
      ...(last?{final:true,size,l:L,t:isVideo?'v':'i',ts,mime,n,thumb:!!thumb}:{size})});
  }
  state.M.push({id,l:L,t:isVideo?'v':'i',ts,mime,size,n,thumb:!!thumb});
  notifyPartner(myName()+' added '+(isVideo?'a video':'a photo')+' to '+L+' \u00b7 '+((state.S[L]&&state.S[L].note)||ideaFor(L)));
  bump();
}

/* ---------- scan success animation (Avi's reference render, driven by real detection) ---------- */
function gridFromClean(clean,lw,lh,cols,rows){
  const cx=clean.getContext('2d',{willReadFrequently:true});
  const hx0=(clean.width-lw*9)/2, hy0=(clean.height-lh*9)/2;
  const colors=[];
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const u=(x+.5+(y&1)*.5)/(cols+.5), v=(1+1.5*y)/(1.5*rows+.5);
    const px=Math.max(0,Math.min(clean.width-1,Math.round(hx0+u*lw*9)));
    const py=Math.max(0,Math.min(clean.height-1,Math.round(hy0+v*lh*9)));
    const d=cx.getImageData(px,py,1,1).data;
    colors.push('#'+((1<<24)+(d[0]<<16)+(d[1]<<8)+d[2]).toString(16).slice(1));
  }
  return {cols,rows,colors};
}
function scanSuccessFX(fx,cap,res,text,code6,onComplete){
  /* the worker/fused decode reports a refined FRACTIONAL layout; re-encoding the
     decoded text gives the code's true integer grid, which is what the clean
     render, the cell sampling and the pose mapping must all use */
  let clean,lw,lh;
  try{
    const code=Prism.encode(new TextEncoder().encode(text),{});
    clean=Prism.render(code,9);
    lw=code.layout.W;lh=code.layout.H;
  }catch(e){clean=cap;lw=res.layout.W;lh=res.layout.H;}
  const grid=gridFromClean(clean,lw,lh,Math.round(lw),Math.round(lh));
  const m0=fx.M0FromQuad(res.quad.map(p=>[p[0],p[1]]),cap.width,cap.height,lw,lh);
  fx.lock(grid,cap,m0);
  return onComplete;
}

      rg.drawImage(bc,(W-bc.width*s2)/2,(H-bc.height*s2)/2,bc.width*s2,bc.height*s2);
      rg.filter='none';
      const vg=rg.createRadialGradient(W/2,H*.44,Math.min(W,H)*.30,W/2,H*.44,Math.max(W,H)*.78);
      vg.addColorStop(0,'rgba(8,6,14,0)');vg.addColorStop(1,'rgba(8,6,14,.66)');
      rg.fillStyle=vg;rg.fillRect(0,0,W,H);
    }
    if(fx){
      const t=fx.time(),pr=fx.probe(t);
      if(pr.ie>0){
        const R=lerp(-pr.feather,pr.Rmax,pr.ie);
        lg.setTransform(dpr,0,0,dpr,0,0);lg.clearRect(0,0,W,H);
        const gr=lg.createRadialGradient(W/2,H*.38,10,W/2,H*.38,Math.max(W,H)*.75);
        gr.addColorStop(0,'#fcfaff');gr.addColorStop(.58,'#f4f1fc');gr.addColorStop(1,'#e9e5f6');
        lg.fillStyle=gr;lg.fillRect(0,0,W,H);
        lg.globalCompositeOperation='destination-in';
        const mk=lg.createRadialGradient(pr.cx,pr.cy,Math.max(.01,R-pr.feather),pr.cx,pr.cy,Math.max(.01,R+pr.feather));
        mk.addColorStop(0,'rgba(0,0,0,1)');mk.addColorStop(1,'rgba(0,0,0,0)');
        lg.fillStyle=mk;lg.fillRect(0,0,W,H);
        lg.globalCompositeOperation='source-over';
        rg.drawImage(lightCv,0,0,W,H);
      }
      const tr=cardEl.style.transform||'';
      if(tr.startsWith('matrix3d')&&cardEl.style.visibility!=='hidden'){
        const m=tr.slice(9,-1).split(',').map(Number);
        const P=(x,y)=>{const X=m[0]*x+m[4]*y+m[12],Y=m[1]*x+m[5]*y+m[13],Ww=m[3]*x+m[7]*y+m[15];return [X/Ww,Y/Ww];};
        const cw=cardEl.width,ch=cardEl.height;
        const bf=/blur\(([-\d.]+)px\)/.exec(cardEl.style.filter||'');
        if(bf)rg.filter='blur('+bf[1]+'px)';
        const NN=20;
        const PW=(x,y)=>{const X=m[0]*x+m[4]*y+m[12],Y=m[1]*x+m[5]*y+m[13],Ww=m[3]*x+m[7]*y+m[15];return [X/Ww,Y/Ww,Ww];};
        const okT=(a,b,c)=>a[2]>0.02&&b[2]>0.02&&c[2]>0.02;
        for(let j=0;j<NN;j++)for(let i=0;i<NN;i++){
          const u0=i/NN,u1=(i+1)/NN,v0=j/NN,v1=(j+1)/NN;
          const S2=(u,v)=>[u*cw,v*ch],Q=(u,v)=>PW(u*cw,v*ch);
          const q00=Q(u0,v0),q10=Q(u1,v0),q11=Q(u1,v1),q01=Q(u0,v1);
          if(okT(q00,q10,q11))drawTri(cardEl,S2(u0,v0),S2(u1,v0),S2(u1,v1),q00,q10,q11);
          if(okT(q00,q11,q01))drawTri(cardEl,S2(u0,v0),S2(u1,v1),S2(u0,v1),q00,q11,q01);
        }
        rg.filter='none';
      }
      rg.setTransform(1,0,0,1,0,0);rg.drawImage(fxEl,0,0);rg.setTransform(dpr,0,0,dpr,0,0);
      drawPill();
    }
  }
  const stream=rec.captureStream(60);
  const mr=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:4500000});
  const chunks=[];mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  mr.start(100);
  let raf;const loop=()=>{composite();raf=requestAnimationFrame(loop);};
  loop();
  window.__recStop=function(){
    return new Promise(res2=>{
      cancelAnimationFrame(raf);clearInterval(logger);
      mr.onstop=()=>{
        const blob=new Blob(chunks,{type:'video/webm'});
        window.__recBlob=blob;res2(JSON.stringify({size:blob.size,lockT}));
      };
      mr.stop();
    });
  };
  return JSON.stringify({started:true,w:rec.width,h:rec.height});
};
window.__liveDemoResult=function(){
  const log=window.__trackLog||[];
  const errs=[];
  for(const s of log){
    if(!s.q||!s.truth||s.t<1.6)continue;
    let best=1e18;
    for(let r=0;r<4;r++){let d=0;for(let i=0;i<4;i++)d+=Math.hypot(s.q[i][0]-s.truth[(i+r)%4][0],s.q[i][1]-s.truth[(i+r)%4][1]);best=Math.min(best,d/4);}
    errs.push({t:+s.t.toFixed(2),err:+best.toFixed(1)});
  }
  const seen=log.filter(s=>s.truth).length,tracked=log.filter(s=>s.truth&&s.q).length;
  return JSON.stringify({samples:log.length,seen,tracked,errs});
};
window.__recUpload=async function(){
  const f=new File([window.__recBlob],'scan-live.webm',{type:'video/webm'});
  const before=state.M.length;
  await uploadMedia('Z',f);
  const m=state.M[state.M.length-1];
  return JSON.stringify({added:state.M.length-before,id:m.id,url:mediaUrl(m,false),size:m.size});
};
window.__recPurge=async function(id){
  await api('/del',{tok:state.tok,id});
  state.M=state.M.filter(m=>m.id!==id);
  return 'purged';
};
/* ---------- boot ---------- */
applyTheme();
route();
/* start entrance animations only after the first real paint, so the stagger
   is visible on the page rather than spent during load */
requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.add('booted')));
if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
